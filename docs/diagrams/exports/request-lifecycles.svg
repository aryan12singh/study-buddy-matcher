<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML state machines — requests, connections and groups</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Each entity changes state only through named methods (accept, decline, cancel, reject, withdraw, end, close); there is no status setter.</text>
<text x="1854" y="1273" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/request-lifecycles.svg</text>
<text x="460.0" y="433.0" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">PENDING</text>
<rect x="112.24999999999999" y="338" width="245.50000000000003" height="71" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="235" y="355" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">send()</text>
<text x="235" y="377" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">[not self, not connected,</text>
<text x="235" y="399" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">no pending request]</text>
<text x="1030.0" y="283.0" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">ACCEPTED</text>
<rect x="605.94" y="219" width="328.12" height="49" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="770" y="236" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">accept()  [actor is receiver]</text>
<text x="770" y="258" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">/ create Connection, notify sender</text>
<text x="1030.0" y="433.0" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">DECLINED</text>
<rect x="624.3" y="369" width="291.40000000000003" height="49" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="770" y="386" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">decline()  [actor is receiver]</text>
<text x="770" y="408" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">/ notify sender</text>
<text x="1030.0" y="583.0" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">CANCELLED</text>
<rect x="638.0699999999999" y="519" width="263.86" height="49" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="770" y="536" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">cancel()  [actor is sender]</text>
<text x="770" y="558" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">/ notify receiver</text>
<text x="1400.0" y="304" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">ACTIVE</text>
<text x="1400.0" y="348" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">endedAt = null</text>
<text x="1400.0" y="372" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">contact number visible</text>
<text x="1400.0" y="494" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">ENDED</text>
<text x="1400.0" y="538" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">endedAt set, row kept</text>
<text x="1400.0" y="562" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">contact hidden again</text>
<rect x="1415" y="235" width="208.78" height="27" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1422" y="252" font-size="17" fill="#506474" font-weight="400" text-anchor="start">MatchRequest accepted</text>
<rect x="1415" y="391" width="300.58000000000004" height="49" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1422" y="408" font-size="17" fill="#506474" font-weight="400" text-anchor="start">end()  [actor is a participant]</text>
<text x="1422" y="430" font-size="17" fill="#506474" font-weight="400" text-anchor="start">/ notify the other student</text>
<text x="460.0" y="923.0" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">PENDING</text>
<rect x="112.24999999999999" y="828" width="245.50000000000003" height="71" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="235" y="845" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">request()</text>
<text x="235" y="867" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">[group open, has room,</text>
<text x="235" y="889" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">not member, none pending]</text>
<text x="1030.0" y="773.0" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">ACCEPTED</text>
<rect x="605.94" y="709" width="328.12" height="49" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="770" y="726" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">accept()  [leader; open, not full]</text>
<text x="770" y="748" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">/ create GroupMembership, notify</text>
<text x="1030.0" y="923.0" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">REJECTED</text>
<rect x="624.3" y="859" width="291.40000000000003" height="49" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="770" y="876" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">reject()  [leader; group open]</text>
<text x="770" y="898" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">/ notify applicant</text>
<text x="1030.0" y="1073.0" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">WITHDRAWN</text>
<rect x="615.12" y="1009" width="309.76" height="49" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="770" y="1026" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">withdraw()  [actor is applicant]</text>
<text x="770" y="1048" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">/ notify leader</text>
<text x="1400.0" y="794" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">OPEN</text>
<text x="1400.0" y="838" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">active = true</text>
<text x="1400.0" y="862" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">leader is the first member</text>
<text x="1400.0" y="984" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">CLOSED</text>
<text x="1400.0" y="1028" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">active = false</text>
<text x="1400.0" y="1052" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">members kept as history</text>
<rect x="1415" y="725" width="172.06" height="27" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1422" y="742" font-size="17" fill="#506474" font-weight="400" text-anchor="start">new StudyGroup(…)</text>
<rect x="1415" y="881" width="263.86" height="49" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1422" y="898" font-size="17" fill="#506474" font-weight="400" text-anchor="start">close()  [actor is leader]</text>
<text x="1422" y="920" font-size="17" fill="#506474" font-weight="400" text-anchor="start">/ GroupClosure.close(group)</text>
<rect x="1583" y="795" width="172.06" height="27" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1590" y="812" font-size="17" fill="#506474" font-weight="400" text-anchor="start">setters  [leader]</text>
<text x="62" y="1178" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Label format: event [guard] / action. A transition out of a final state throws IllegalStateException, which the API reports as 409 STATE_CONFLICT.</text>
<text x="62" y="1203" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Deactivating an account also cancels its pending match requests, withdraws its applications, ends its connections and closes the groups it leads (StudentDeactivation).</text>
</g></svg>
