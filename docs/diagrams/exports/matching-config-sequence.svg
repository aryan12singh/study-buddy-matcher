<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML sequence — administrator retunes the matching engine</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">PUT /api/admin/matching-config saves a new version; the next search reads it and ranks through the chosen strategy.</text>
<text x="2394" y="1473" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/matching-config-sequence.svg</text>
<text x="120" y="265" font-size="17" fill="#172d3b" font-weight="700" text-anchor="middle">Administrator</text>
<text x="280" y="265" font-size="17" fill="#172d3b" font-weight="700" text-anchor="middle">Student</text>
<text x="560" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:AdminMatchingConfigController</text>
<text x="930" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:MatchingConfigService</text>
<text x="1180" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:AccountAccess</text>
<text x="1480" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">setting:MatchingStrategySetting</text>
<text x="1790" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:MatchController</text>
<text x="2030" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:MatchService</text>
<text x="2270" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:MatchingStrategy</text>
<rect x="189.44" y="283" width="301.12" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="340.0" y="299" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">1: PUT /api/admin/matching-config</text>
<rect x="620.36" y="328" width="249.28000000000003" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="745.0" y="344" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">2: update(request, actorId)</text>
<rect x="956.28" y="373" width="197.44" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1055.0" y="389" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">3: lockAdmin(actorId)</text>
<rect x="988" y="444.0" width="387.52000000000004" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="995" y="460.0" font-size="16" fill="#506474" font-weight="400" text-anchor="start">4: validWeights(request.weights(), enabled)</text>
<rect x="988" y="524.0" width="378.88" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="995" y="540.0" font-size="16" fill="#506474" font-weight="400" text-anchor="start">5: lockSettings(request.expectedVersion())</text>
<text x="70" y="625" font-size="16" fill="#254e73" font-weight="700" text-anchor="start">alt</text>
<rect x="135" y="610" width="456.64000000000004" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="142" y="626" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">[expectedVersion equals setting.getConfigVersion()]</text>
<rect x="988" y="669.0" width="430.72" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="995" y="685.0" font-size="16" fill="#506474" font-weight="400" text-anchor="start">6: saveWeights(type, weights)  for each strategy</text>
<rect x="1006.92" y="733" width="396.16" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1205.0" y="749" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">7: saveOverride(strategy, enabled, minScore)</text>
<rect x="1538" y="774.0" width="301.12" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1545" y="790.0" font-size="16" fill="#506474" font-weight="400" text-anchor="start">7.1: changed()  (configVersion++)</text>
<rect x="603.0799999999999" y="805" width="283.84000000000003" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="745.0" y="821" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">MatchingConfigDto (new version)</text>
<rect x="306.08" y="825" width="67.84" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="340.0" y="841" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">200 OK</text>
<rect x="71" y="868" width="67.84" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="78" y="884" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">[else]</text>
<rect x="629.0" y="871" width="232.0" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="745.0" y="887" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">409 STALE_MATCHING_CONFIG</text>
<rect x="944.92" y="963" width="180.16000000000003" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1035.0" y="979" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">8: GET /api/matches</text>
<rect x="1781.04" y="1003" width="257.92" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1910.0" y="1019" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">9: search(criteria, actorId)</text>
<rect x="1411.52" y="1043" width="136.96" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1480.0" y="1059" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">10: snapshot()</text>
<rect x="1135.04" y="1083" width="689.9200000000001" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1480.0" y="1099" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">MatchingConfigSnapshot (strategy, weights, enabledCriteria, minScore, version)</text>
<rect x="2021.04" y="1128" width="257.92" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="2150.0" y="1144" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">11: ranking(enabledCriteria)</text>
<rect x="2046.96" y="1158" width="206.08" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="2150.0" y="1174" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">Comparator&lt;MatchScore&gt;</text>
<rect x="1815.6" y="1193" width="188.8" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1910.0" y="1209" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">MatchSearchResultDto</text>
<rect x="836.92" y="1228" width="396.16" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1035.0" y="1244" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">200 OK: results ranked with the new settings</text>
<text x="62" y="1358" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">:MatchingStrategy is whichever implementation the administrator chose: BalancedStrategy, AvailabilityFirstStrategy or CourseFirstStrategy. MatchService only knows the interface.</text>
<text x="62" y="1383" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">validWeights() builds a MatchingWeights per strategy (each weight 0..1, sum 1); validEnabled() and validThreshold() run just before it. After saveOverride() the setting row is saved through its repository.</text>
<text x="62" y="1408" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">lockSettings() takes the row lock and compares versions, so when two administrators save at once the second gets 409 and reloads. Each search reads one snapshot of the settings.</text>
</g></svg>
