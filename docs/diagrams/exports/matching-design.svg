<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML classes — scoring and ranking</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Independent scoring, ordering and wording responsibilities keep the matching engine explainable.</text>
<text x="1754" y="1303" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/matching-design.svg</text>
<text x="67" y="201" font-size="18" fill="#254e73" font-weight="700" text-anchor="start">SCORING: PURE COLLABORATORS</text>
<text x="937" y="201" font-size="18" fill="#254e73" font-weight="700" text-anchor="start">RANKING: STRATEGY + TEMPLATE METHOD</text>
<text x="250.0" y="278" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">WeightedMatchScorer</text>
<text x="91" y="323" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ score(searcher, candidate, search,</text>
<text x="91" y="349" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  weights, enabled): MatchScore</text>
<text x="670.0" y="250" font-size="15" fill="#254e73" font-weight="400" text-anchor="middle">«interface»</text>
<text x="670.0" y="279" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">CriterionScorer</text>
<text x="501" y="324" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ criterion(): MatchingCriterion</text>
<text x="501" y="350" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ score(searcher, candidate,</text>
<text x="501" y="376" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  search): CriterionResult</text>
<text x="250.0" y="545" font-size="15" fill="#254e73" font-weight="400" text-anchor="middle">«record»</text>
<text x="250.0" y="574" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">MatchScore</text>
<text x="91" y="619" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">breakdown:</text>
<text x="91" y="645" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  Map&lt;MatchingCriterion, Double&gt;</text>
<text x="91" y="671" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">total: double</text>
<text x="91" y="697" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">sharedHoursPerWeek: double</text>
<text x="91" y="723" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">quality: MatchQuality</text>
<text x="91" y="749" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">unknownCriteria:</text>
<text x="91" y="775" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  Set&lt;MatchingCriterion&gt;</text>
<text x="670.0" y="523" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">CourseScorer</text>
<text x="670.0" y="605" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">AvailabilityOverlapScorer</text>
<text x="670.0" y="687" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">StudyModeScorer</text>
<text x="670.0" y="769" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">StudyGoalScorer</text>
<text x="670.0" y="851" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">GroupSizeScorer</text>
<rect x="429.8" y="267" width="48.400000000000006" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="454" y="282" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">uses</text>
<rect x="207.87" y="433" width="80.26" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="248" y="450" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">creates</text>
<text x="1340.0" y="250" font-size="15" fill="#254e73" font-weight="400" text-anchor="middle">«interface»</text>
<text x="1340.0" y="279" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">MatchingStrategy</text>
<text x="1141" y="324" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ type(): MatchingStrategyType</text>
<text x="1141" y="350" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ ranking(enabled): Comparator&lt;MatchScore&gt;</text>
<text x="1115.0" y="528" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">BalancedStrategy</text>
<text x="961" y="573" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ ranking(enabled)</text>
<text x="1537.5" y="490" font-size="15" fill="#254e73" font-weight="400" text-anchor="middle">«abstract»</text>
<text x="1537.5" y="519" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">PriorityTierStrategy</text>
<text x="1371" y="564" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ tierOf(score): int</text>
<text x="1371" y="590" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ ranking(enabled)</text>
<text x="1371" y="616" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start"># priority(): MatchingCriterion</text>
<text x="1371" y="642" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start"># priorityValue(score): double</text>
<text x="1130.0" y="823" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">AvailabilityFirstStrategy</text>
<text x="1545.0" y="823" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">CourseFirstStrategy</text>
<text x="962" y="903" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Priority bands first, then total; a disabled priority falls back to total.</text>
<text x="63" y="1025" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">MatchService</text>
<text x="63" y="1059" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">search(criteria, actorId): MatchSearchResultDto</text>
<text x="63" y="1086" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">One configuration snapshot; filter, score,</text>
<text x="63" y="1113" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">threshold, order, limit and assemble.</text>
<text x="653" y="1025" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">MatchingConfigService</text>
<text x="653" y="1059" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">snapshot(): MatchingConfigSnapshot</text>
<text x="653" y="1086" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Strategy + weights + enabled criteria</text>
<text x="653" y="1113" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ minimum score + persistent version</text>
<text x="1223" y="1025" font-size="23" fill="#176c63" font-weight="700" text-anchor="start">MatchResultAssembler</text>
<text x="1223" y="1059" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">toDto(...): MatchResultDto</text>
<text x="1223" y="1086" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Uses MatchExplainer / TemplateMatchExplainer</text>
<text x="1223" y="1113" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">for deterministic text; exposes no contact.</text>
<text x="62" y="1218" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Dashed line + hollow triangle = interface implementation; solid line + hollow triangle = class inheritance. Ordinary arrows are dependencies.</text>
<text x="62" y="1243" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Signatures omit repeated generic/parameter types for readability. CriterionResult records score + known; immutable interval values appear in the detailed matching source.</text>
</g></svg>
