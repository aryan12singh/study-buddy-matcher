<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML sequence — deterministic match discovery</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">GET /api/matches: source-ordered filtering and ranking, safe DTO output, explicit failure and empty-result paths.</text>
<text x="1754" y="1363" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/matching-sequence.svg</text>
