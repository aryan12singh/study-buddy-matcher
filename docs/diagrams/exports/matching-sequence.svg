<rect x="638" y="929.0" width="448.0" height="47" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="645" y="945.0" font-size="16" fill="#506474" font-weight="400" text-anchor="start">8: keep total ≥ minScore and minQuality, sort with</text>
<text x="645" y="966.0" font-size="16" fill="#506474" font-weight="400" text-anchor="start">strategy.ranking(enabledCriteria)</text>
<text x="480" y="1035" font-size="16" fill="#254e73" font-weight="700" text-anchor="start">loop</text>
<rect x="545" y="1020" width="404.8" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
