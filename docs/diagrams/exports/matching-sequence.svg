<rect x="943.24" y="1043" width="603.52" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1245.0" y="1059" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">9: toDto(searcher, candidate, score, search, settings, relationship)</text>
<rect x="1090.12" y="1071" width="309.76" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1245.0" y="1087" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">MatchResultDto (no contact number)</text>
<rect x="360.6" y="1113" width="188.8" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="455.0" y="1129" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">MatchSearchResultDto</text>
<rect x="129.92" y="1153" width="180.16000000000003" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="220.0" y="1169" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">200 OK: ranked list</text>
<text x="62" y="1283" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">:CriterionScorer stands for the five injected implementations (course, availability, study mode, study goal, group size); WeightedMatchScorer calls each through the interface.</text>
<text x="62" y="1308" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">An invalid filter or limit ends the call with 400 before any scoring, and no match is an ordinary 200 with an empty list. Solid arrow = call, dashed arrow = return.</text>
