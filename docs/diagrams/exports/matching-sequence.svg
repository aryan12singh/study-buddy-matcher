<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML sequence — ranked match search</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">GET /api/matches: MatchService.search scores every eligible candidate with the admin&#x27;s current settings.</text>
