<text x="552" y="656" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">[each eligible candidate that MatchSearchFilter accepts]</text>
<rect x="724.4" y="673" width="491.20000000000005" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
