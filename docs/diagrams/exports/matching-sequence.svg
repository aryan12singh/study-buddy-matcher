<rect x="800.78" y="812" width="548.44" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1075.0" y="829" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">MatchScore: total, quality, unknown criteria, shared hours</text>
<text x="585" y="930" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Keep total ≥ admin minScore and quality ≥ minQuality.</text>
<text x="585" y="959" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Apply selected sort → strategy ranking → shared hours → name → ID.</text>
<text x="585" y="988" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Record totalMatches, then apply the result limit.</text>
<rect x="944.96" y="1030" width="530.08" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1210.0" y="1047" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">toDto(public profile, score, shared time, request state)</text>
<rect x="986.27" y="1080" width="447.46000000000004" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1210.0" y="1097" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">MatchResultDto list; template explanation added</text>
<rect x="394.63" y="1130" width="410.74" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="600.0" y="1147" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">MatchSearchResultDto + configurationVersion</text>
<rect x="71.26999999999998" y="1180" width="447.46000000000004" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="295.0" y="1197" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">200: ordered matches, or [] with totalMatches=0</text>
<text x="62" y="1278" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">No contact, email, credential, token or persistence entity is returned in discovery. The card renders scores, bars and shared time; wording is fetched on request (E1).</text>
<text x="62" y="1303" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Grouped lifelines are named collaborators, not additional classes. The optional E1 explanation request has a separate companion view.</text>
