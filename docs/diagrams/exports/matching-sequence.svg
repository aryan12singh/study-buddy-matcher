<text x="830.0" y="589" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">MatchingConfigSnapshot (strategy, weights, enabledCriteria, minScore)</text>
<text x="480" y="655" font-size="16" fill="#254e73" font-weight="700" text-anchor="start">loop</text>
