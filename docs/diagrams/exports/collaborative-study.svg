<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML collaborators — rooms, sessions and weather</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Three bounded E2 responsibilities; room presence, durable shared state and dated plans have separate lifecycles.</text>
<text x="1754" y="1353" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/collaborative-study.svg</text>
<text x="67" y="201" font-size="18" fill="#176c63" font-weight="700" text-anchor="start">PRIVATE GROUP ROOM</text>
<text x="647" y="201" font-size="18" fill="#176c63" font-weight="700" text-anchor="start">DATED GROUP / BUDDY SESSIONS</text>
<text x="1227" y="201" font-size="18" fill="#176c63" font-weight="700" text-anchor="start">OPTIONAL CAMPUS WEATHER</text>
<text x="325.0" y="268" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">StudyRoomService</text>
<text x="101" y="313" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ state(groupId, actorId): StudyRoomDto</text>
<text x="101" y="339" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ join(...), heartbeat(...): StudyRoomDto</text>
<text x="101" y="365" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ leave(...): void</text>
<text x="101" y="391" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ controlTimer(...),</text>
<text x="101" y="417" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  configure(...): StudyRoomDto</text>
<text x="325.0" y="538" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">StudyRoom</text>
<text x="101" y="583" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- studyGroup: StudyGroup [1]</text>
<text x="101" y="609" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- host, coHost: Student [0..1 each]</text>
<text x="101" y="635" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- version: long</text>
<text x="101" y="681" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ timer(): PomodoroTimer</text>
<text x="101" y="707" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ applyTimer(timer): void</text>
<text x="325.0" y="828" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">RoomPresence</text>
<text x="101" y="873" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- studyRoom: StudyRoom [1]</text>
<text x="101" y="899" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- student: Student [1]</text>
<text x="101" y="925" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- clientId: UUID</text>
<text x="101" y="951" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- expiresAt, observedAt: Instant</text>
<text x="101" y="997" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ renew(presence, now, expiresAt): void</text>
<rect x="266.51" y="460" width="116.98" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="325" y="477" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">coordinates</text>
<rect x="336.41" y="731" width="25.18" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="349" y="748" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">1</text>
<rect x="334.64" y="762" width="52.72" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="361" y="779" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">0..*</text>
<text x="92" y="1093" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Read / renew: membership check; no group lock.</text>
<text x="92" y="1118" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Join / control: account locks → group lock.</text>
<text x="905.0" y="268" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">StudySessionService</text>
<text x="681" y="313" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ createGroup(...), createBuddy(...)</text>
<text x="681" y="339" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ edit(...), cancel(...): SessionDto</text>
<text x="681" y="365" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ calendar(id, actorId): CalendarExportDto</text>
<text x="905.0" y="493" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">StudySession</text>
<text x="681" y="538" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- group: StudyGroup [0..1]</text>
<text x="681" y="564" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- connection: Connection [0..1]</text>
<text x="681" y="590" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- version: long</text>
<text x="681" y="616" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- status: SessionStatus</text>
<text x="681" y="662" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ schedule(): SessionSchedule</text>
<text x="681" y="688" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ edit(details, now): void</text>
<text x="681" y="714" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ cancel(now): void</text>
<text x="905.0" y="850" font-size="15" fill="#176c63" font-weight="400" text-anchor="middle">«record»</text>
<text x="905.0" y="879" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">SessionSchedule</text>
<text x="681" y="924" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">startLocal, endLocal: LocalDateTime</text>
<text x="681" y="950" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">timeZone: String</text>
<text x="681" y="976" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">occurrenceCount: int</text>
<text x="681" y="1022" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ occurrences(): List&lt;SessionOccurrenceDto&gt;</text>
<rect x="768.48" y="399" width="273.04" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="905" y="416" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">authorizes via SessionAccess</text>
<rect x="777.66" y="769" width="254.68" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="905" y="786" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">constructs immutable value</text>
<text x="672" y="1118" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Exactly one parent: group XOR connection.</text>
<text x="672" y="1143" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">SessionCalendar emits private UTC snapshots.</text>
<text x="1480.0" y="268" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">WeatherService</text>
<text x="1261" y="313" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ current(): WeatherDto</text>
<text x="1480.0" y="480" font-size="15" fill="#176c63" font-weight="400" text-anchor="middle">«interface»</text>
<text x="1480.0" y="509" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">WeatherClient</text>
<text x="1261" y="554" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ fetch(): WeatherSample</text>
<text x="1480.0" y="718" font-size="22" fill="#176c63" font-weight="700" text-anchor="middle">OpenMeteoClient</text>
<text x="1261" y="763" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ fetch(): WeatherSample</text>
<rect x="1375.61" y="384" width="208.78" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1480" y="401" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">bounded cache / retry</text>
<text x="1263" y="950" font-size="23" fill="#8a5a1a" font-weight="700" text-anchor="start">Open-Meteo API</text>
<text x="1263" y="984" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Fixed campus coordinates and weather fields.</text>
<text x="1263" y="1011" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">No student identity, location or schedule.</text>
<rect x="1352.66" y="839" width="254.68" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1480" y="856" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">Java HTTP client + timeout</text>
<text x="62" y="1238" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">RoomAccess / SessionAccess check current account and parent authority; RoomAssembler / SessionAssembler / WeatherAssembler return DTOs.</text>
<text x="62" y="1263" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">PomodoroTimer is an immutable server-time value. SessionAvailability reuses WeeklyAvailability; SessionEvents writes recipient notifications transactionally.</text>
<text x="62" y="1288" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Detailed E2 transaction and ER diagrams are in TEAM_C.md. E1 match explanations have their own companion view in E1.md.</text>
</g></svg>
