<rect x="1197.56" y="353" width="54.88" height="28" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1225" y="371" font-size="18" fill="#506474" font-weight="400" text-anchor="middle">0..1</text>
<rect x="860.14" y="547" width="25.72" height="28" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="873" y="565" font-size="18" fill="#506474" font-weight="400" text-anchor="middle">1</text>
<rect x="855.56" y="676" width="54.88" height="28" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="883" y="694" font-size="18" fill="#506474" font-weight="400" text-anchor="middle">0..*</text>
<rect x="809.87" y="615" width="80.26" height="27" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="850" y="632" font-size="17" fill="#506474" font-weight="400" text-anchor="middle">student</text>
<text x="1177" y="583" font-size="19" fill="#8a5a1a" font-weight="700" text-anchor="start">Association, not inheritance</text>
<text x="1177" y="613" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Student ID = account ID.</text>
<text x="1177" y="638" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">An administrator need not have</text>
<text x="1177" y="663" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">a Student profile.</text>
<text x="1177" y="688" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Empty optional preferences are</text>
<text x="1177" y="713" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">unknown to the matching engine.</text>
<text x="62" y="1008" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Multiplicity is written at each endpoint. Plain associations do not imply cascade deletion; SQL migrations and lifecycle services define cleanup.</text>
<text x="62" y="1033" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Selected attributes are shown; ordinary constructors/getters/setters are omitted. Weekly slots are recurring Asia/Singapore civil times.</text>
</g></svg>
