<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML classes — identity and study profile</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Concrete account and profile entities are associated through a shared identifier; there is no User inheritance tree.</text>
<text x="1554" y="1103" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/identity-profile.svg</text>
<text x="235.0" y="243" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">User</text>
<text x="76" y="288" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- id: Long</text>
<text x="76" y="314" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- email: String</text>
<text x="76" y="340" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- passwordHash: String</text>
<text x="76" y="366" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- role: Role</text>
<text x="76" y="392" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- active: boolean</text>
<text x="76" y="418" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- tokenVersion: long</text>
<text x="76" y="444" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- lastLoginAt: Instant</text>
<text x="850.0" y="213" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">Student</text>
<text x="626" y="258" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- id: Long</text>
<text x="626" y="284" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- user: User</text>
<text x="626" y="310" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- name, school, programme: String</text>
<text x="626" y="336" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- yearOfStudy: Integer</text>
<text x="626" y="362" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- contactNumber: String</text>
<text x="626" y="388" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- coursesTaken: Set&lt;Course&gt;</text>
<text x="626" y="414" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- targetCourse: Course</text>
<text x="626" y="440" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- preferredStudyMode: StudyMode</text>
<text x="626" y="466" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- preferredGroupSizeMin/Max: Integer</text>
<text x="626" y="492" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- studyGoals: Set&lt;StudyGoal&gt;</text>
<text x="1400.0" y="243" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">Course</text>
<text x="1276" y="288" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- id: Long</text>
<text x="1276" y="314" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- code: String</text>
<text x="1276" y="340" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- name: String</text>
<text x="850.0" y="753" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">AvailabilitySlot</text>
<text x="626" y="798" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- student: Student</text>
<text x="626" y="824" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- dayOfWeek: DayOfWeek</text>
<text x="626" y="850" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- startTime, endTime: LocalTime</text>
<text x="235.0" y="745" font-size="15" fill="#254e73" font-weight="400" text-anchor="middle">«enumeration»</text>
