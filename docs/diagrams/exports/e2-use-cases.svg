<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML use cases — collaborative study (E2)</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Selected extension merged with PR #52; this panel supplements the compulsory use cases.</text>
<text x="46" y="1143" font-size="15" fill="#506474" font-weight="400" text-anchor="start">Checked against 9592fd2 · 18 October 2026 · baseline + E2</text>
<text x="1554" y="1143" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/e2-use-cases.svg</text>
<text x="255" y="206" font-size="19" fill="#176c63" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER / E2</text>
<text x="100" y="600" font-size="22" fill="#172d3b" font-weight="700" text-anchor="middle">Student</text>
<text x="595" y="284" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Join / leave private room</text>
<text x="595" y="308" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and view current participants</text>
<text x="955" y="282" font-size="18" fill="#506474" font-weight="400" text-anchor="start">Accepted active group member;</text>
<text x="955" y="307" font-size="18" fill="#506474" font-weight="400" text-anchor="start">distinct students count toward capacity.</text>
<text x="595" y="399" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Control Pomodoro</text>
<text x="595" y="423" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and room configuration</text>
<text x="955" y="397" font-size="18" fill="#506474" font-weight="400" text-anchor="start">Group leader or present assigned host/co-host;</text>
<text x="955" y="422" font-size="18" fill="#506474" font-weight="400" text-anchor="start">only the leader assigns host roles.</text>
<text x="595" y="514" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Play Spotify and</text>
<text x="595" y="538" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">ambient sounds</text>
<text x="955" y="512" font-size="18" fill="#506474" font-weight="400" text-anchor="start">Music tab in room settings;</text>
<text x="955" y="537" font-size="18" fill="#506474" font-weight="400" text-anchor="start">heard only in this browser.</text>
<text x="595" y="629" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Plan / edit / cancel</text>
<text x="595" y="653" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">group or buddy sessions</text>
<text x="955" y="627" font-size="18" fill="#506474" font-weight="400" text-anchor="start">Group leader or active buddy participant;</text>
<text x="955" y="652" font-size="18" fill="#506474" font-weight="400" text-anchor="start">other accepted group members may view.</text>
<text x="595" y="744" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">View mutual availability</text>
<text x="595" y="768" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and export calendar snapshot</text>
<text x="955" y="742" font-size="18" fill="#506474" font-weight="400" text-anchor="start">Current parent relationship required;</text>
<text x="955" y="767" font-size="18" fill="#506474" font-weight="400" text-anchor="start">suggestions do not confirm attendance.</text>
<text x="595" y="859" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Choose room atmosphere</text>
<text x="595" y="883" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and view campus weather</text>
<text x="955" y="857" font-size="18" fill="#506474" font-weight="400" text-anchor="start">Selectable original scenes; optional</text>
<text x="955" y="882" font-size="18" fill="#506474" font-weight="400" text-anchor="start">cached Open-Meteo campus conditions.</text>
<text x="62" y="1048" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">No global online status, public room, chat, calendar synchronization or RSVP workflow is implied. Calendar files are private snapshots.</text>
<text x="62" y="1073" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">E1 explanations have a separate companion view. Human/device and external-client acceptance require their own evidence.</text>
</g></svg>
