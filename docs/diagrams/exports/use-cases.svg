<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML use cases — compulsory requirements</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">The brief&#x27;s three user groups. A study group leader is a student, so the leader actor specialises Student.</text>
<text x="1554" y="1393" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/use-cases.svg</text>
<text x="275" y="200" font-size="19" fill="#254e73" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER</text>
<text x="105" y="580" font-size="22" fill="#172d3b" font-weight="700" text-anchor="middle">Student</text>
<text x="105" y="1110" font-size="22" fill="#172d3b" font-weight="700" text-anchor="middle">Study Group</text>
<text x="105" y="1136" font-size="22" fill="#172d3b" font-weight="700" text-anchor="middle">Leader</text>
<text x="1495" y="620" font-size="22" fill="#172d3b" font-weight="700" text-anchor="middle">System</text>
<text x="1495" y="646" font-size="22" fill="#172d3b" font-weight="700" text-anchor="middle">Administrator</text>
<text x="560" y="251" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Register an account</text>
<text x="560" y="327" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Sign in</text>
<text x="560" y="391" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Manage profile and</text>
<text x="560" y="415" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">study preferences</text>
<text x="560" y="479" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Set weekly availability</text>
<text x="560" y="543" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Search and filter</text>
<text x="560" y="567" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">ranked study buddies</text>
<text x="560" y="631" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">View a student&#x27;s public profile</text>
<text x="560" y="695" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Send, accept or decline</text>
<text x="560" y="719" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">match requests</text>
<text x="560" y="771" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">View and end</text>
<text x="560" y="795" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">buddy connections</text>
<text x="560" y="847" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Browse groups and</text>
<text x="560" y="871" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">request to join</text>
<text x="560" y="949" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Create a study group</text>
<text x="560" y="973" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">for a course</text>
<text x="560" y="1037" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Update or close the group</text>
<text x="560" y="1101" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Accept or reject</text>
<text x="560" y="1125" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">join requests</text>
<text x="560" y="1189" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Remove a member</text>
<text x="1085" y="659" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Create, update and</text>
<text x="1085" y="683" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">delete user accounts</text>
<text x="1085" y="753" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">View account status</text>
<text x="1085" y="777" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and basic usage</text>
<text x="1085" y="847" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Configure matching criteria,</text>
<text x="1085" y="871" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">weights and strategy</text>
<text x="1085" y="543" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Explain this match</text>
<text x="1085" y="567" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">(extra E1, on request)</text>
<rect x="791.6" y="513" width="80.80000000000001" height="25" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="832" y="528" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">«extend»</text>
<text x="847" y="988" font-size="19" fill="#254e73" font-weight="700" text-anchor="start">Leader = Student + one group</text>
<text x="847" y="1018" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">A leader is the student a group references</text>
<text x="847" y="1043" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">(group.isLeader); there is no leader subclass</text>
<text x="847" y="1068" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">or global leader role in the code.</text>
<text x="847" y="1148" font-size="19" fill="#8a5a1a" font-weight="700" text-anchor="start">Contact privacy</text>
<text x="847" y="1178" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Viewing a profile hides the contact number</text>
<text x="847" y="1203" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">until a match request has been accepted.</text>
<text x="62" y="1303" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Notation: stick figure = actor, ellipse = use case, rectangle = system boundary, solid line = association, hollow arrow = the leader actor is a kind of Student.</text>
<text x="62" y="1328" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">«extend»: the optional explanation adds to the search only when a student asks for it. The collaborative-study use cases (extra E2) are a separate panel.</text>
</g></svg>
