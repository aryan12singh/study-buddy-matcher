<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML use cases — compulsory baseline</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Actors are account capabilities; group leadership is a relationship with one particular group.</text>
<text x="1554" y="1323" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/use-cases.svg</text>
<text x="255" y="200" font-size="19" fill="#254e73" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER</text>
<text x="102" y="650" font-size="22" fill="#172d3b" font-weight="700" text-anchor="middle">Student</text>
<text x="1485" y="650" font-size="22" fill="#172d3b" font-weight="700" text-anchor="middle">Administrator</text>
<text x="535" y="266" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Register student account</text>
<text x="535" y="351" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Sign in</text>
<text x="535" y="424" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Edit own profile</text>
<text x="535" y="448" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and study preferences</text>
<text x="535" y="509" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Replace / clear</text>
<text x="535" y="533" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">weekly availability</text>
<text x="535" y="594" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Find and compare</text>
<text x="535" y="618" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">ranked buddies</text>
<text x="535" y="691" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Read student profile</text>
<text x="535" y="764" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Send / answer requests</text>
<text x="535" y="788" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and view / end connections</text>
<text x="535" y="849" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Browse, create and</text>
<text x="535" y="873" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">apply to study groups</text>
<text x="535" y="934" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Manage a led group</text>
<text x="535" y="958" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and membership requests</text>
<text x="535" y="1044" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Read / mark own</text>
<text x="535" y="1068" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">notifications</text>
<text x="1090" y="514" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Create / edit / delete</text>
<text x="1090" y="538" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and activate / deactivate accounts</text>
<text x="1090" y="694" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">View account status</text>
<text x="1090" y="718" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">and basic usage</text>
<text x="1090" y="874" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Configure matching criteria,</text>
<text x="1090" y="898" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">weights and active strategy</text>
<text x="852" y="1018" font-size="19" fill="#254e73" font-weight="700" text-anchor="start">Group-scoped authority</text>
<text x="852" y="1048" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Leader operations require group.leader.id</text>
<text x="852" y="1073" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">to equal the current student. No leader</text>
<text x="852" y="1098" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">subclass or global leader role exists.</text>
<text x="292" y="1158" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Profile reads enforce contact privacy.</text>
<text x="292" y="1183" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Registration and sign-in are public; other actions need an active account.</text>
<text x="62" y="1268" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Notation: actor association = solid line; ellipse = use case; rectangle = application boundary. E2 use cases are a separate panel.</text>
</g></svg>
