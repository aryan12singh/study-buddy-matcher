<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML sequence — group leader approves a join request</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">POST /api/groups/{id}/join-requests/{requestId}/accept: leader check, capacity check and the new membership in one transaction.</text>
<text x="2094" y="1333" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/group-join-sequence.svg</text>
<text x="120" y="265" font-size="17" fill="#172d3b" font-weight="700" text-anchor="middle">Group leader</text>
<text x="400" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:GroupJoinRequestController</text>
<text x="770" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:GroupJoinRequestService</text>
<text x="1110" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">request:GroupJoinRequest</text>
<text x="1380" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">group:StudyGroup</text>
<text x="1670" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:GroupMembershipRepository</text>
<text x="1960" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:NotificationService</text>
<rect x="131.04" y="283" width="257.92" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="260.0" y="299" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">1: POST …/{requestId}/accept</text>
<rect x="412.84" y="328" width="344.32000000000005" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="585.0" y="344" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">2: accept(groupId, requestId, actorId)</text>
<rect x="828" y="406.0" width="214.72000000000003" height="47" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="835" y="422.0" font-size="16" fill="#506474" font-weight="400" text-anchor="start">3: forDecision(groupId,</text>
<text x="835" y="443.0" font-size="16" fill="#506474" font-weight="400" text-anchor="start">requestId, actorId)</text>
<text x="60" y="525" font-size="16" fill="#254e73" font-weight="700" text-anchor="start">alt</text>
<rect x="125" y="510" width="378.88" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="132" y="526" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">[request PENDING; group open and not full]</text>
<rect x="849.92" y="548" width="180.16000000000003" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="940.0" y="564" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">4: requirePending()</text>
<rect x="1010.84" y="593" width="128.32" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1075.0" y="609" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">5: isActive()</text>
<rect x="1078.08" y="638" width="283.84000000000003" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1220.0" y="654" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">6: countByStudyGroupId(groupId)</text>
<rect x="1164.48" y="668" width="111.04" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1220.0" y="684" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">memberCount</text>
<rect x="954.68" y="713" width="240.64000000000001" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1075.0" y="729" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">7: hasRoomFor(memberCount)</text>
<rect x="1049.72" y="743" width="50.56" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1075.0" y="759" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">true</text>
<rect x="884.48" y="788" width="111.04" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="940.0" y="804" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">8: accept()</text>
<rect x="1168" y="829.0" width="206.08" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1175" y="845.0" font-size="16" fill="#506474" font-weight="400" text-anchor="start">8.1: respond(ACCEPTED)</text>
<rect x="1013.28" y="878" width="413.44000000000005" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1220.0" y="894" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">9: save(new GroupMembership(group, applicant))</text>
<rect x="1141.0" y="923" width="448.0" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1365.0" y="939" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">10: notify(applicant, GROUP_JOIN_REQUEST_ACCEPTED)</text>
<rect x="447.4" y="973" width="275.20000000000005" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="585.0" y="989" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">GroupJoinRequestDto (ACCEPTED)</text>
<rect x="226.07999999999998" y="995" width="67.84" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="260.0" y="1011" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">200 OK</text>
<rect x="61" y="1041" width="67.84" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="68" y="1057" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">[else]</text>
<rect x="412.84" y="1053" width="344.32000000000005" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="585.0" y="1069" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">409 Conflict: answered, closed or full</text>
<text x="62" y="1248" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">forDecision() confirms the actor leads this group (otherwise 403), locks the leader and applicant accounts, then locks the group row before loading the request for update.</text>
<text x="62" y="1273" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Because approvals queue on the group row, two approvals can never both take the last place. Leadership is a relationship with one group (group.isLeader), not a role or subclass.</text>
</g></svg>
