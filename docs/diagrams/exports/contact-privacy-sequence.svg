<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML sequence — who receives the contact number</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">GET /api/students/{id}/profile: the assembler chooses the DTO type on the server, so a stranger&#x27;s response has no contact field at all.</text>
<text x="2264" y="1208" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/contact-privacy-sequence.svg</text>
<text x="110" y="265" font-size="17" fill="#172d3b" font-weight="700" text-anchor="middle">Student</text>
<text x="390" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:ProfileViewController</text>
<text x="710" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:ProfileViewService</text>
<text x="960" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:AccountAccess</text>
<text x="1230" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:ProfileViewAssembler</text>
<text x="1570" y="241" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:ProfileRelationshipAssembler</text>
<rect x="99.44" y="283" width="301.12" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="250.0" y="299" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">1: GET /api/students/{id}/profile</text>
<rect x="421.03999999999996" y="328" width="257.92" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="550.0" y="344" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">2: view(subjectId, viewerId)</text>
<rect x="710.36" y="373" width="249.28000000000003" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="835.0" y="389" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">3: requireStudent(viewerId)</text>
<rect x="701.72" y="418" width="266.56" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="835.0" y="434" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">4: eligibleStudent(subjectId)</text>
<rect x="753.56" y="453" width="162.88" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="835.0" y="469" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">subject : Student</text>
<rect x="832.4" y="498" width="275.20000000000005" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="970.0" y="514" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">5: assemble(subject, viewerId)</text>
<rect x="1253.76" y="543" width="292.48" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1400.0" y="559" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">6: assemble(subjectId, viewerId)</text>
<rect x="1232.16" y="583" width="335.68" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1400.0" y="599" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">relationship : ProfileRelationshipDto</text>
<text x="1100" y="665" font-size="16" fill="#254e73" font-weight="700" text-anchor="start">alt</text>
<rect x="1165" y="650" width="387.52000000000004" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1172" y="666" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">[relationship.state() is SELF or CONNECTED]</text>
<text x="1870" y="737" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:ConnectedProfileDto</text>
<rect x="1338.12" y="703" width="309.76" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1493.0" y="719" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">7a: «create» (…, contactNumber, …)</text>
<rect x="1101" y="786" width="422.08000000000004" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1108" y="802" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">[else: STRANGER, or a request is still pending]</text>
<text x="2090" y="862" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">:PublicProfileDto</text>
<rect x="1408.3999999999999" y="828" width="404.8" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="1610.8" y="844" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">7b: «create» (… no contactNumber component …)</text>
<rect x="918.8" y="898" width="102.4" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="970.0" y="914" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">ProfileDto</text>
<rect x="498.8" y="938" width="102.4" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="550.0" y="954" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">ProfileDto</text>
<rect x="155.6" y="978" width="188.8" height="26" rx="3" fill="white" stroke="none" stroke-width="1.5" />
<text x="250.0" y="994" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">200 OK, never cached</text>
<text x="62" y="1108" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">ProfileDto is a sealed interface that permits exactly these two records. PublicProfileDto has no contactNumber component, so the value cannot be serialised by mistake.</text>
<text x="62" y="1133" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">CONNECTED means an active Connection exists between viewer and subject. Group membership and administrator rights never select ConnectedProfileDto.</text>
</g></svg>
