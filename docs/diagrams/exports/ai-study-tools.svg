<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML collaborators — quizzes, study plans and Pixel</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Three student features share one Gemini client; each checks the model&#x27;s reply before anything is saved or shown.</text>
<text x="1754" y="1533" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/ai-study-tools.svg</text>
<text x="67" y="201" font-size="18" fill="#8a5a1a" font-weight="700" text-anchor="start">QUIZZES (GROUP / PERSONAL)</text>
<text x="647" y="201" font-size="18" fill="#8a5a1a" font-weight="700" text-anchor="start">STUDY PLANS (PERSONAL / SESSION)</text>
<text x="1227" y="201" font-size="18" fill="#8a5a1a" font-weight="700" text-anchor="start">PIXEL STUDY ASSISTANT</text>
<text x="325.0" y="263" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">QuizCreationService</text>
<text x="101" y="308" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ startForGroup(groupId, actorId,</text>
<text x="101" y="334" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  input, files): QuizDto</text>
<text x="101" y="360" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ startPersonal(actorId, input,</text>
<text x="101" y="386" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  files): QuizDto</text>
<text x="325.0" y="503" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">QuizWriter</text>
<text x="101" y="548" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ write(studentId, course, focus,</text>
<text x="101" y="574" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  material): QuizDraft</text>
<text x="325.0" y="683" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">QuizOutputValidator</text>
<text x="101" y="728" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ validate(raw): Optional&lt;QuizDraft&gt;</text>
<text x="325.0" y="833" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">Quiz</text>
<text x="101" y="878" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- scope: QuizScope</text>
<text x="101" y="904" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- group: StudyGroup [0..1]</text>
<text x="101" y="930" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- session: StudySession [0..1]</text>
<text x="101" y="976" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ statusAt(now): QuizStatus</text>
<text x="101" y="1002" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ close(now): void</text>
<rect x="268.4" y="613" width="113.2" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="325" y="628" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">checks reply</text>
<text x="905.0" y="263" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">StudyPlanCreationService</text>
<text x="681" y="308" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ createPersonal(actorId, input,</text>
<text x="681" y="334" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  files): StudyPlanDto</text>
<text x="681" y="360" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ createForSession(actorId,</text>
<text x="681" y="386" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  sessionId, input, files)</text>
<text x="905.0" y="503" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">RoadmapWriter</text>
<text x="681" y="548" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ write(studentId, course, goal,</text>
<text x="681" y="574" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  frame, material): RoadmapDraft</text>
<text x="905.0" y="683" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">StudyPlanOutputValidator</text>
<text x="681" y="728" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ validate(raw, frame):</text>
<text x="681" y="754" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  Optional&lt;RoadmapDraft&gt;</text>
<text x="905.0" y="833" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">StudyPlan</text>
<text x="681" y="878" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- scope: StudyPlanScope</text>
<text x="681" y="904" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- student: Student [0..1]</text>
<text x="681" y="930" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- session: StudySession [0..1]</text>
<text x="681" y="976" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ markEntry(entryId, completed,</text>
<text x="681" y="1002" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  now): boolean</text>
<rect x="848.4" y="613" width="113.2" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="905" y="628" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">checks reply</text>
<text x="1480.0" y="263" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">AssistantService</text>
<text x="1261" y="308" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ reply(actorId, input):</text>
<text x="1261" y="334" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  AssistantReplyDto</text>
<text x="1480.0" y="443" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">QuickIntentReader</text>
<text x="1261" y="488" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ read(message):</text>
<text x="1261" y="514" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  Optional&lt;AssistantRequest&gt;</text>
<text x="1480.0" y="623" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">IntentParser</text>
<text x="1261" y="668" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ parse(studentId, message):</text>
<text x="1261" y="694" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  AssistantRequest</text>
<text x="1480.0" y="795" font-size="15" fill="#254e73" font-weight="400" text-anchor="middle">«interface»</text>
<text x="1480.0" y="824" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">AssistantIntent</text>
<text x="1261" y="869" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ type(): AssistantIntentType</text>
<text x="1261" y="895" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ reply(actorId, request)</text>
<rect x="1427.45" y="378" width="105.10000000000001" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1480" y="393" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">rules first</text>
<rect x="1675.8" y="505" width="48.400000000000006" height="45" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1700" y="520" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">else</text>
<text x="1700" y="540" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">AI</text>
<rect x="1188.65" y="685" width="72.7" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1225" y="700" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">answers</text>
<text x="1252" y="1013" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Nine intents (find buddies, meet times,</text>
<text x="1252" y="1038" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">to-dos, plan a session, ...) answer from</text>
<text x="1252" y="1063" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">existing services; Gemini only classifies.</text>
<text x="92" y="1058" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">QuizMarker scores; QuizLeaderboard ranks.</text>
<text x="92" y="1083" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Group answers stay on the server until</text>
<text x="92" y="1108" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">the quiz closes.</text>
<text x="672" y="1058" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">StudyMaterialReader checks file types.</text>
<text x="672" y="1083" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">StudyPlanCalendar / SessionMeetingFrames</text>
<text x="672" y="1108" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">build the frame the reply must fill.</text>
<text x="345.0" y="1250" font-size="15" fill="#254e73" font-weight="400" text-anchor="middle">«interface»</text>
<text x="345.0" y="1279" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">AiClient</text>
<text x="101" y="1324" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ generateJson(studentId, prompt,</text>
<text x="101" y="1350" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">  attachments): String</text>
<text x="875.0" y="1258" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">GeminiClient</text>
<text x="681" y="1303" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ generateJson(...): String</text>
<text x="1355.0" y="1258" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">AiQuota</text>
<text x="1161" y="1303" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ tryAcquire(studentId): boolean</text>
<text x="1161" y="1329" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ pauseAfterRateLimit(): void</text>
<text x="62" y="1428" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">QuizWriter, RoadmapWriter and AssistantAi depend on the AiClient interface, so tests supply a fake. Pixel uses a lighter model with its own allowance.</text>
<text x="62" y="1453" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Failed, refused or over-quota calls return 503 AI_UNAVAILABLE and save nothing; prompts are versioned files under resources/prompts.</text>
</g></svg>
