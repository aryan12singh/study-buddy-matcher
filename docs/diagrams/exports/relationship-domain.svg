<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML classes — relationships and group authority</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Requests hold decision history; active connections and accepted memberships are distinct domain objects.</text>
<text x="1554" y="1363" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/relationship-domain.svg</text>
<text x="265.0" y="233" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">MatchRequest</text>
<text x="76" y="278" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- sender, receiver: Student</text>
<text x="76" y="304" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- message: String</text>
<text x="76" y="330" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- status: MatchRequestStatus</text>
<text x="76" y="356" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- respondedAt: Instant</text>
<text x="76" y="402" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ accept(): void</text>
<text x="76" y="428" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ decline(): void</text>
<text x="76" y="454" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ cancel(): void</text>
<text x="1335.0" y="233" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">Connection</text>
<text x="1146" y="278" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">- studentA, studentB: Student</text>
<text x="1146" y="304" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">- endedAt: Instant</text>
<text x="1146" y="350" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">+ isActive(): boolean</text>
<text x="1146" y="376" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">+ involves(studentId: Long): boolean</text>
<text x="1146" y="402" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">+ otherStudent(studentId: Long): Student</text>
<text x="1146" y="428" font-size="16" fill="#172d3b" font-weight="400" text-anchor="start">+ end(): void</text>
<text x="800.0" y="618" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">Student</text>
<text x="616" y="663" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- id: Long</text>
<text x="616" y="689" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- name: String</text>
<text x="265.0" y="698" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">GroupMembership</text>
<text x="76" y="743" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- studyGroup: StudyGroup</text>
<text x="76" y="769" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- student: Student</text>
<text x="76" y="795" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- joinedAt: Instant</text>
<text x="1335.0" y="698" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">GroupJoinRequest</text>
<text x="1146" y="743" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- studyGroup: StudyGroup</text>
<text x="1146" y="769" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- student: Student</text>
<text x="1146" y="795" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">- status: GroupJoinRequestStatus</text>
<text x="1146" y="841" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ accept(): void</text>
<text x="1146" y="867" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">+ reject(): void</text>
<text x="800.0" y="983" font-size="22" fill="#254e73" font-weight="700" text-anchor="middle">StudyGroup</text>
<text x="616" y="1028" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- leader: Student</text>
<text x="616" y="1054" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- course: Course [1]</text>
<text x="616" y="1080" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- maxGroupSize: Integer</text>
<text x="616" y="1106" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">- active: boolean</text>
<text x="616" y="1152" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ isLeader(studentId: Long): boolean</text>
<text x="616" y="1178" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">+ close(): void</text>
