<text x="62" y="1268" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Each group has exactly one student leader who also has an accepted membership. The capacity rule counts the leader.</text>
<text x="62" y="1293" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Each request/connection has two distinct students. Connections are active exactly while endedAt is null; accepted group membership has no request status.</text>
