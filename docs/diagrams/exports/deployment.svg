<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">UML deployment — demo and team setup</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Three tiers and four outside services. For the demo the first two nodes are the same laptop (localhost); the team shares one hosted database.</text>
<text x="2044" y="1213" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/deployment.svg</text>
<text x="265.0" y="454" font-size="14" fill="#176c63" font-weight="400" text-anchor="middle">«artifact»</text>
<text x="265.0" y="478" font-size="18" fill="#176c63" font-weight="700" text-anchor="middle">React application</text>
<text x="265.0" y="506" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">index.html, JavaScript, CSS</text>
<text x="265.0" y="530" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">token kept in sessionStorage</text>
<text x="1040.0" y="449" font-size="14" fill="#254e73" font-weight="400" text-anchor="middle">«artifact»</text>
<text x="1040.0" y="473" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">study-buddy-matcher-backend.jar</text>
<text x="1040.0" y="501" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">Spring Boot with embedded Tomcat, port 8080</text>
<text x="1040.0" y="699" font-size="14" fill="#254e73" font-weight="400" text-anchor="middle">«process»</text>
<text x="1040.0" y="723" font-size="18" fill="#254e73" font-weight="700" text-anchor="middle">Vite development server</text>
<text x="1040.0" y="751" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">serves frontend/ on port 5173</text>
<text x="1795.0" y="359" font-size="14" fill="#176c63" font-weight="400" text-anchor="middle">«database»</text>
<text x="1795.0" y="383" font-size="18" fill="#176c63" font-weight="700" text-anchor="middle">PostgreSQL database</text>
<text x="1795.0" y="411" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">Supabase for the team</text>
<text x="1795.0" y="435" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">Docker container for the local demo</text>
<text x="1795.0" y="459" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">34 tables created by SQL migrations</text>
<text x="1795" y="700" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Google Gemini API (optional: Anthropic API)</text>
<text x="1795" y="744" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Spotify Accounts and Web API</text>
<text x="1795" y="788" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Freesound API</text>
<text x="1795" y="832" font-size="18" fill="#172d3b" font-weight="400" text-anchor="middle">Open-Meteo API</text>
<text x="265" y="915" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">backend: ./mvnw test with postgres:17</text>
<text x="265" y="945" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">frontend: test, lint, build</text>
<text x="265" y="975" font-size="17" fill="#172d3b" font-weight="400" text-anchor="middle">runs on every pull request</text>
<rect x="526.56" y="368" width="162.88" height="47" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="608" y="384" font-size="16" fill="#172d3b" font-weight="400" text-anchor="middle">«HTTP» JSON + JWT</text>
<text x="608" y="405" font-size="16" fill="#172d3b" font-weight="400" text-anchor="middle">port 8080</text>
<rect x="517.92" y="714" width="180.16000000000003" height="47" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="608" y="730" font-size="16" fill="#172d3b" font-weight="400" text-anchor="middle">«HTTP» static files</text>
<text x="608" y="751" font-size="16" fill="#172d3b" font-weight="400" text-anchor="middle">port 5173</text>
<rect x="1390.2" y="368" width="145.60000000000002" height="47" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1463" y="384" font-size="16" fill="#172d3b" font-weight="400" text-anchor="middle">«JDBC» over TLS</text>
<text x="1463" y="405" font-size="16" fill="#172d3b" font-weight="400" text-anchor="middle">port 5432</text>
<rect x="1385.88" y="784" width="154.24" height="47" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1463" y="800" font-size="16" fill="#172d3b" font-weight="400" text-anchor="middle">«HTTPS»</text>
<text x="1463" y="821" font-size="16" fill="#172d3b" font-weight="400" text-anchor="middle">server-side keys</text>
<text x="77" y="1083" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Solid line = communication path with its protocol. The browser talks only to the API; it has no database driver, key or connection string.</text>
<text x="77" y="1108" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Spotify playback and Freesound previews also stream straight to the browser, after the backend has exchanged the token or chosen the sound.</text>
<text x="77" y="1133" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Demo passwords, the JWT secret and provider keys come from application-local.yml or the environment and are never committed.</text>
</g></svg>
