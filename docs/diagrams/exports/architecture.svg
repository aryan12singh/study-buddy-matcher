<text x="1182" y="405" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">request</text>
<rect x="1109.6" y="765" width="80.80000000000001" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1150" y="780" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">assemble</text>
<rect x="234.51999999999998" y="821" width="190.96" height="28" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="330" y="839" font-size="18" fill="#176c63" font-weight="400" text-anchor="middle">JSON response DTOs</text>
<text x="62" y="1018" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Contact is returned only to its owner or an active accepted buddy. Group membership and admin authority do not grant it.</text>
<text x="62" y="1043" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">E1 provider calls have a separate companion view; they are outside this baseline + E2 architecture at 9592fd2.</text>
