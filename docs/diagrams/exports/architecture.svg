<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">Architecture: layers, boundaries and privacy</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">Requests pass down through the layers; services return DTOs back up. The browser never reaches the database.</text>
<text x="1554" y="1243" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/architecture.svg</text>
<text x="452" y="181" font-size="18" fill="#254e73" font-weight="700" text-anchor="start">SPRING BOOT BACKEND</text>
<text x="63" y="235" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">React + Vite</text>
<text x="63" y="269" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Feature folders per screen</text>
<text x="63" y="296" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">One shared Axios API client</text>
<text x="63" y="323" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Route guards = UI only</text>
<text x="63" y="350" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">No database access</text>
<text x="63" y="475" font-size="23" fill="#8a5a1a" font-weight="700" text-anchor="start">In-browser media</text>
<text x="63" y="509" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Spotify SDK and playlist embed</text>
<text x="63" y="536" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Freesound previews play here</text>
<text x="63" y="655" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Configuration</text>
<text x="63" y="689" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">application.yml + env vars</text>
<text x="63" y="716" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">21 @ConfigurationProperties</text>
<text x="63" y="743" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Admin matching overrides (DB)</text>
<text x="63" y="915" font-size="23" fill="#176c63" font-weight="700" text-anchor="start">PostgreSQL</text>
<text x="63" y="949" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Hosted by Supabase</text>
<text x="63" y="976" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">SQL migrations own the schema</text>
<text x="63" y="1003" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Hibernate only validates it</text>
<text x="63" y="1030" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">RLS; browser grants revoked</text>
<text x="473" y="235" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Spring Security</text>
<text x="473" y="269" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">JWT signature · active account · role · token version</text>
<text x="473" y="296" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Loads the user through UserRepository on every request</text>
<text x="473" y="375" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Controllers</text>
<text x="473" y="409" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Validate typed input</text>
<text x="473" y="436" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Call one service method</text>
<text x="473" y="463" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Return the DTO as JSON</text>
<text x="843" y="375" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">ApiExceptionHandler</text>
<text x="843" y="409" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">@RestControllerAdvice</text>
<text x="843" y="436" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Exceptions → error JSON</text>
<text x="843" y="463" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Rollback already done by Spring</text>
<text x="473" y="550" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Services</text>
<text x="473" y="584" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">@Transactional business rules; notifications saved in the same transaction</text>
<text x="473" y="611" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">AccountAccess: checks who may act, locks accounts in a fixed order</text>
<text x="473" y="638" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Call the assemblers and return DTOs, so entities never leave the backend</text>
<text x="473" y="730" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Entities</text>
<text x="473" y="764" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Own state rules</text>
<text x="473" y="791" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Change via methods:</text>
<text x="473" y="818" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">accept(), close(),</text>
<text x="473" y="845" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">deactivate()</text>
<text x="683" y="730" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Matching</text>
<text x="683" y="764" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">CriterionScorer ×5</text>
<text x="683" y="791" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">MatchingStrategy ×3</text>
<text x="683" y="818" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Strategy + Template</text>
<text x="683" y="845" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Method patterns</text>
<text x="913" y="730" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Client interfaces</text>
<text x="913" y="764" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">AiClient</text>
<text x="913" y="791" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">WeatherClient</text>
<text x="913" y="818" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">SoundSearchClient</text>
<text x="913" y="845" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">ExplanationProvider (E1)</text>
<text x="473" y="940" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">JPA repositories</text>
<text x="473" y="974" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Spring Data JPA</text>
<text x="473" y="1001" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Row locks for transitions</text>
<text x="473" y="1028" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Also read by some assemblers</text>
<text x="843" y="940" font-size="23" fill="#176c63" font-weight="700" text-anchor="start">DTO assemblers</text>
<text x="843" y="974" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">sealed ProfileDto:</text>
<text x="843" y="1001" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Public = no contact</text>
<text x="843" y="1028" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Connected = has contact</text>
<text x="1258" y="550" font-size="23" fill="#8a5a1a" font-weight="700" text-anchor="start">Spotify Accounts</text>
<text x="1258" y="584" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Sign-in and token refresh</text>
<text x="1258" y="611" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Direct concrete client:</text>
<text x="1258" y="638" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">SpotifyAccountsClient</text>
<text x="1258" y="730" font-size="23" fill="#8a5a1a" font-weight="700" text-anchor="start">External APIs</text>
<text x="1258" y="764" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Gemini, optional Claude (AI)</text>
<text x="1258" y="791" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Freesound (ambient sounds)</text>
<text x="1258" y="818" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Open-Meteo (cached, fallback)</text>
<rect x="366.5" y="211" width="97.0" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="415" y="226" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">JWT + JSON</text>
<rect x="628.1" y="871" width="53.800000000000004" height="24" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="655" y="885" font-size="14" fill="#506474" font-weight="400" text-anchor="middle">query</text>
<rect x="858.1" y="871" width="53.800000000000004" height="24" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="885" y="885" font-size="14" fill="#506474" font-weight="400" text-anchor="middle">build</text>
<rect x="390.8" y="985" width="48.400000000000006" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="415" y="1000" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">JDBC</text>
<rect x="386.75" y="630" width="56.5" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="415" y="645" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">binds</text>
<rect x="1169.75" y="745" width="56.5" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1198" y="760" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">HTTPS</text>
<rect x="757.85" y="488" width="40.3" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="778" y="503" font-size="15" fill="#176c63" font-weight="400" text-anchor="middle">DTO</text>
<rect x="380.8" y="377" width="48.400000000000006" height="45" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="405" y="392" font-size="15" fill="#176c63" font-weight="400" text-anchor="middle">DTO</text>
<text x="405" y="412" font-size="15" fill="#176c63" font-weight="400" text-anchor="middle">JSON</text>
<text x="62" y="1108" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">20 feature packages (studygroup/, matching/, profile/ …) each hold their own controller and service, plus repositories where they store data; shared: common, security, ai, user, seed.</text>
<text x="62" y="1133" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Contact goes only to its owner or an active accepted buddy; group membership and admin rights never grant it. Keys and secrets stay on the backend.</text>
<text x="62" y="1158" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Arrows: grey = calls or depends on · teal = DTO returned towards the browser.</text>
</g></svg>
