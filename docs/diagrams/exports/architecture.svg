<text x="46" y="45" font-size="15" fill="#a8d4ca" font-weight="700" text-anchor="start">STUDY BUDDY MATCHER  /  DESIGN REFERENCE</text>
<text x="46" y="85" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">Architecture and privacy boundaries</text>
<text x="46" y="110" font-size="17" fill="#d9e5ea" font-weight="400" text-anchor="start">The browser reaches application data only through the authenticated Spring API.</text>
<text x="1554" y="1103" font-size="14" fill="#506474" font-weight="400" text-anchor="end">docs/diagrams/exports/architecture.svg</text>
<text x="477" y="201" font-size="18" fill="#254e73" font-weight="700" text-anchor="start">SPRING BOOT BACKEND</text>
<text x="63" y="295" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">React + Vite</text>
<text x="63" y="329" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Screens and route guards</text>
<text x="63" y="356" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Shared authenticated API client</text>
<text x="63" y="383" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Local drafts and music player</text>
<text x="63" y="410" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Calendar snapshot download</text>
<text x="63" y="437" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">No database access</text>
<text x="63" y="595" font-size="23" fill="#8a5a1a" font-weight="700" text-anchor="start">Spotify Web Playback</text>
<text x="63" y="629" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">SDK script from sdk.scdn.co</text>
<text x="63" y="656" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Premium: token from the API</text>
<text x="63" y="683" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Free: embedded playlist player</text>
<text x="523" y="265" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Spring Security</text>
<text x="523" y="299" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">JWT signature · active account · role · token version</text>
<text x="523" y="425" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Controllers</text>
<text x="523" y="459" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Validate typed input</text>
<text x="523" y="486" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Delegate one service call</text>
<text x="863" y="425" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Services</text>
<text x="863" y="459" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Authorize current actor</text>
<text x="863" y="486" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Coordinate domain rules</text>
<text x="523" y="615" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">Domain and values</text>
<text x="523" y="649" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Entities retain state rules</text>
<text x="523" y="676" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Scorers / strategies</text>
<text x="523" y="703" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Immutable value objects</text>
<text x="863" y="615" font-size="23" fill="#254e73" font-weight="700" text-anchor="start">JPA repositories</text>
<text x="863" y="649" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Read and persist entities</text>
<text x="863" y="676" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Ordered transition locks</text>
<text x="863" y="703" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Database constraints</text>
<text x="523" y="835" font-size="23" fill="#176c63" font-weight="700" text-anchor="start">DTO assemblers</text>
<text x="523" y="869" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">ProfileViewAssembler picks the permitted response shape.</text>
<text x="523" y="896" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">PublicProfileDto omits the contact; ConnectedProfileDto has it.</text>
<text x="1258" y="210" font-size="23" fill="#8a5a1a" font-weight="700" text-anchor="start">Google Gemini</text>
<text x="1258" y="244" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Explanations, quizzes, study</text>
<text x="1258" y="271" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">plans and the Pixel assistant</text>
<text x="1258" y="346" font-size="23" fill="#8a5a1a" font-weight="700" text-anchor="start">Spotify Accounts</text>
<text x="1258" y="380" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Sign-in and token refresh</text>
<text x="1258" y="407" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">for the browser player</text>
<text x="1258" y="482" font-size="23" fill="#8a5a1a" font-weight="700" text-anchor="start">Freesound</text>
<text x="1258" y="516" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">CC0 ambient sound search;</text>
<text x="1258" y="543" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">the browser plays previews</text>
<text x="1258" y="618" font-size="23" fill="#8a5a1a" font-weight="700" text-anchor="start">Open-Meteo</text>
<text x="1258" y="652" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">Campus weather at fixed</text>
<text x="1258" y="679" font-size="17" fill="#172d3b" font-weight="400" text-anchor="start">coordinates; cached, fallback</text>
<rect x="1161.75" y="303" width="56.5" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1190" y="318" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">HTTPS</text>
<text x="1258" y="805" font-size="23" fill="#176c63" font-weight="700" text-anchor="start">PostgreSQL</text>
<text x="1258" y="839" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Managed by Supabase</text>
<text x="1258" y="866" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">Backend JDBC access</text>
<text x="1258" y="893" font-size="19" fill="#172d3b" font-weight="400" text-anchor="start">RLS; browser grants revoked</text>
<rect x="344.5" y="236" width="97.0" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="393" y="251" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">JWT + JSON</text>
<rect x="153.4" y="503" width="113.2" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="210" y="518" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">loads script</text>
<rect x="1179.72" y="774" width="50.56" height="26" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="1205" y="790" font-size="16" fill="#506474" font-weight="400" text-anchor="middle">JDBC</text>
<rect x="784.6" y="751" width="80.80000000000001" height="25" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="825" y="766" font-size="15" fill="#506474" font-weight="400" text-anchor="middle">assemble</text>
<rect x="395.8" y="635" width="48.400000000000006" height="45" rx="3" fill="#f6f8f9" stroke="none" stroke-width="1.5" />
<text x="420" y="650" font-size="15" fill="#176c63" font-weight="400" text-anchor="middle">JSON</text>
<text x="420" y="670" font-size="15" fill="#176c63" font-weight="400" text-anchor="middle">DTOs</text>
<text x="62" y="1018" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Contact is returned only to its owner or an active accepted buddy. Group membership and admin authority do not grant it.</text>
<text x="62" y="1043" font-size="18" fill="#172d3b" font-weight="400" text-anchor="start">Provider keys and the Spotify client secret stay on the backend; the browser receives only a Spotify access token for its own player.</text>
</g></svg>
