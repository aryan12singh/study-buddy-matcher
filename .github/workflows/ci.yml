name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Both halves run on every PR, including changes to workflows, SQL and setup scripts.
jobs:
  backend:
    name: Backend tests and PostgreSQL integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studybuddy_test
          POSTGRES_USER: studybuddy_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-isolated-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studybuddy_test -d studybuddy_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: studybuddy_test
      PGUSER: studybuddy_test
      PGPASSWORD: ${{ github.run_id }}-isolated-ci
      SPRING_PROFILES_ACTIVE: test
      STUDYBUDDY_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/studybuddy_test
      STUDYBUDDY_TEST_DATABASE_USERNAME: studybuddy_test
      STUDYBUDDY_TEST_DATABASE_PASSWORD: ${{ github.run_id }}-isolated-ci
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Generate an isolated test signing key
        shell: bash
        run: |
          task_jwt_secret="$(openssl rand -base64 48)"
          echo "::add-mask::$task_jwt_secret"
          echo "STUDYBUDDY_TEST_JWT_SECRET=$task_jwt_secret" >> "$GITHUB_ENV"
      - name: Apply and repeat migrations
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --command='CREATE DATABASE studybuddy_migration_test'
          PGDATABASE=studybuddy_migration_test scripts/test-migrations.sh
          scripts/migrate-database.sh
          scripts/migrate-database.sh
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B clean test

  frontend:
    name: Frontend interactions, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run interaction tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
