spring:
  application:
    name: study-buddy-matcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  auth:
    secret: ${jwt.secret}
    token-lifetime: ${jwt.expiration-ms}ms
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    student-password: ${DEMO_STUDENT_PASSWORD:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
