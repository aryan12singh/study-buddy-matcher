spring:
  application:
    name: study-buddy-matcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Spring's default of 10 open connections per backend lets one developer fill most of
      # Supabase's 15-client Session pooler; 5 is plenty for one person and lets three share it.
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
  servlet:
    multipart:
      # Study plan uploads; both follow the assistant's own limit so they cannot drift apart.
      max-file-size: ${app.ai.assistant.study-plan.max-upload-size}
      max-request-size: ${app.ai.assistant.study-plan.max-upload-size}
  jpa:
    hibernate:
      # The SQL migrations own the schema; Hibernate only checks the mappings against it.
      # Run scripts/migrate-database.sh against every database, local ones included; do not override this.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  study-session:
    maximum-occurrences: ${SESSION_MAXIMUM_OCCURRENCES:52}
    maximum-duration-hours: ${SESSION_MAXIMUM_DURATION_HOURS:24}
  weather:
    enabled: ${WEATHER_ENABLED:true}
    latitude: ${WEATHER_LATITUDE:1.297}
    longitude: ${WEATHER_LONGITUDE:103.849}
    location: ${WEATHER_LOCATION:SMU campus}
    timeout: ${WEATHER_TIMEOUT:4s}
    cache-lifetime: ${WEATHER_CACHE_LIFETIME:15m}
    retry-interval: ${WEATHER_RETRY_INTERVAL:1m}
    maximum-stale-age: ${WEATHER_MAXIMUM_STALE_AGE:24h}
  study-room:
    default-focus-minutes: ${ROOM_DEFAULT_FOCUS_MINUTES:25}
    default-break-minutes: ${ROOM_DEFAULT_BREAK_MINUTES:5}
    max-focus-minutes: ${ROOM_MAX_FOCUS_MINUTES:180}
    max-break-minutes: ${ROOM_MAX_BREAK_MINUTES:60}
    # Longer than the one-minute timer floor browsers apply to long-hidden tabs, so a student
    # reading in another tab keeps their place. Closing the tab still leaves immediately.
    lease-lifetime: ${ROOM_LEASE_LIFETIME:90s}
    poll-interval: ${ROOM_POLL_INTERVAL:2s}
  auth:
    secret: ${jwt.secret}
    token-lifetime: ${jwt.expiration-ms}ms
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    # Wrong passwords in a row for one email before sign-in for it pauses for the lockout.
    login-throttle:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lockout: ${LOGIN_LOCKOUT:15m}
  profile:
    group-size-max: ${PROFILE_GROUP_SIZE_MAX:5}
    max-courses: ${PROFILE_MAX_COURSES:8}
    year-of-study-max: ${PROFILE_YEAR_OF_STUDY_MAX:6}
  achievements:
    # Weeks start on Monday in this zone when counting the study streak.
    week-zone: Asia/Singapore
    points-per-level: 3
    connections: { bronze: 1, silver: 3, gold: 5 }
    requests-sent: { bronze: 1, silver: 5, gold: 10 }
    groups-joined: { bronze: 1, silver: 2, gold: 3 }
    groups-led: { bronze: 1, silver: 2, gold: 3 }
    sessions-planned: { bronze: 1, silver: 5, gold: 10 }
    streak-weeks: { bronze: 2, silver: 4, gold: 8 }
  matching:
    default-strategy: BALANCED
    default-enabled-criteria: [COURSE, AVAILABILITY, STUDY_MODE, STUDY_GOAL, GROUP_SIZE]
    default-min-score: 0.0
    default-result-limit: 20
    max-result-limit: 50
    # Every strategy has all five weights; omitted values are zero. Enabled weights add up to 1.
    # A priority strategy gives its own criterion the largest share, so the score and label
    # on a card always reflect what the list is ranked by.
    default-weights:
      balanced:
        course: 0.30
        availability: 0.30
        study-mode: 0.20
        study-goal: 0.10
        group-size: 0.10
      availability-first:
        course: 0.25
        availability: 0.40
        study-mode: 0.15
        study-goal: 0.10
        group-size: 0.10
      course-first:
        course: 0.40
        availability: 0.25
        study-mode: 0.15
        study-goal: 0.10
        group-size: 0.10
    # Priority strategies rank by bands of their criterion first, then by score within a band.
    # The list is the lower bound of every band but the last, best first. Course-first has no
    # setting: its bands are 1.0 and scoring.takes-course-score, so they always match the scorer.
    priority-tiers:
      # 3 h or more, 1 to 3 h, under 1 h of shared time per week.
      availability-hours: [3.0, 1.0]
    quality:
      strong: 0.75
      good: 0.50
    scoring:
      # What a criterion is worth when either student left it empty. 0 means missing
      # data never outranks real compatibility; the card shows it as "not shared".
      unknown-score: 0.0
      # Course score for a candidate who takes the course in focus but wants a buddy for another.
      takes-course-score: 0.5
      # Shortest shared block that counts as time to meet; shorter overlaps are ignored.
      min-session-minutes: 60
  ai:
    explanation:
      # Off unless application-local.yml sets enabled: true and api-key. Never put the key here.
      enabled: false
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-3.5-flash
      timeout: 5s
      max-output-tokens: 200
      max-characters: 600
      # Google's free tier allows 20 generate requests per day per project and model.
      daily-call-limit: 18
      # So one student cannot use up the shared allowance; cached explanations do not count.
      daily-call-limit-per-student: 5
      quota-zone: Asia/Singapore
      rate-limit-cooldown: 60s
    assistant:
      # Off unless application-local.yml sets enabled: true and api-key. Never put the key here.
      # Use a key from a different Google project than E1's, so the two do not share a quota.
      enabled: false
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-3.5-flash
      # Reading a PDF and writing a whole roadmap or a ten-question quiz takes far longer than E1's
      # one sentence: a quiz from a lecture PDF can take Gemini well over 30 seconds.
      timeout: 90s
      max-output-tokens: 4000
      # Google's free tier allows 20 generate requests per day per project and model.
      daily-call-limit: 18
      daily-call-limit-per-student: 5
      quota-zone: Asia/Singapore
      rate-limit-cooldown: 60s
      study-plan:
        # All of one plan's files together. Base64 makes attached PDFs a third larger, so 10MB
        # stays inside Gemini's inline request limit.
        max-upload-size: 10MB
        # Enough for a few weeks of slides, one file per week.
        max-files: 6
        max-topics-characters: 4000
        # All of one plan's text files together: about 25,000 tokens of notes, well inside the
        # free tier's tokens-per-minute limit.
        max-text-file-characters: 100000
        # Roadmap size limits, stated in the prompt and checked again on Gemini's reply.
        max-source-topics: 40
        max-entries-per-block: 5
        max-tasks-per-entry: 5
        # A personal plan runs from today to at most this many weeks ahead, so the exam can be
        # at most this far away. Each week holds the student's hours, up to max-hours-per-week.
        max-weeks: 16
        max-hours-per-week: 40
        # "Today", for a plan's first week, follows the students' calendar, not the server's.
        time-zone: Asia/Singapore
      quiz:
        # Stated in the prompt and checked again on Gemini's reply.
        question-count: 10
        # An open quiz past this reads as closed, so no scheduler is needed.
        open-duration: 15m
        # The optional "what to focus on" text, which also titles the quiz, so at most 255.
        max-focus-characters: 200
      chat:
        max-message-characters: 500
        # Buddy matches shown in a reply; the rest are on the Find buddies page.
        matches-shown: 3
        # "Today", for dates such as "exam on 20 Nov", follows the students' calendar.
        time-zone: Asia/Singapore
        # Reading a message is a small job, so the chat uses a lighter model with its own allowance:
        # chatting never spends what students need for quizzes and study plans. The clearest
        # messages (the suggested questions, "what do I need to do?") need no AI call at all.
        # Google's free tier limits each model separately; check the lite model's daily limit in
        # Google AI Studio and keep daily-call-limit just under it.
        model: gemini-3.5-flash-lite
        max-output-tokens: 400
        timeout: 20s
        daily-call-limit: 200
        daily-call-limit-per-student: 30
  ambient:
    # Sounds are unavailable until application-local.yml sets api-key. Never put the key here.
    base-url: https://freesound.org/apiv2
    api-key:
    timeout: 5s
    # Search results to choose a random sound from.
    candidate-count: 15
    # Shorter clips loop audibly; longer ones are slow to start on campus wifi.
    min-duration-seconds: 30
    max-duration-seconds: 600
    # CC0 sounds are public domain, so the mixer can play them without crediting each author.
    license: Creative Commons 0
    categories:
      - id: rain
        label: Rain
        query: rain ambience
      - id: cafe
        label: Cafe
        query: cafe ambience
      - id: forest
        label: Forest
        query: forest birds ambience
      - id: ocean
        label: Ocean
        query: ocean waves
      - id: fireplace
        label: Fireplace
        query: fireplace crackling
      - id: wind
        label: Wind
        query: wind ambience
  spotify:
    # Off until application-local.yml sets client-id and client-secret. Never put either here.
    client-id:
    client-secret:
    # Must match a redirect URI registered in the Spotify app dashboard. Spotify rejects
    # "localhost"; use the loopback address.
    redirect-uri: ${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/spotify/callback}
    # Where the browser returns after sign-in.
    return-url: ${SPOTIFY_RETURN_URL:http://localhost:5173/study-room}
    accounts-url: https://accounts.spotify.com
    api-url: https://api.spotify.com/v1
    # streaming, user-read-email and user-read-private are required by the Web Playback SDK.
    scopes: [streaming, user-read-email, user-read-private, user-modify-playback-state]
    timeout: 5s
    authorization-lifetime: 10m
    token-refresh-margin: 60s
    search-limit: 10
    max-query-length: 100
    # Played through Spotify's embed for students without Premium. Chosen by the team.
    embed-playlist-id: 3bZTQGrvewbkJJe6UpTFKc
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    student-password: ${DEMO_STUDENT_PASSWORD:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
