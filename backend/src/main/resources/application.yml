spring:
  application:
    name: study-buddy-matcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  auth:
    secret: ${jwt.secret}
    token-lifetime: ${jwt.expiration-ms}ms
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  profile:
    group-size-max: ${PROFILE_GROUP_SIZE_MAX:5}
    max-courses: ${PROFILE_MAX_COURSES:8}
  matching:
    default-strategy: BALANCED
    default-enabled-criteria: [COURSE, AVAILABILITY, STUDY_MODE, STUDY_GOAL, GROUP_SIZE]
    default-min-score: 0.0
    default-result-limit: 20
    max-result-limit: 50
    # Every strategy has all five weights; omitted values are zero. Enabled weights add up to 1.
    # A priority strategy gives its own criterion the largest share, so the score and label
    # on a card always reflect what the list is ranked by.
    default-weights:
      balanced:
        course: 0.30
        availability: 0.30
        study-mode: 0.20
        study-goal: 0.10
        group-size: 0.10
      availability-first:
        course: 0.25
        availability: 0.40
        study-mode: 0.15
        study-goal: 0.10
        group-size: 0.10
      course-first:
        course: 0.40
        availability: 0.25
        study-mode: 0.15
        study-goal: 0.10
        group-size: 0.10
    # Priority strategies rank by bands of their criterion first, then by score within a band.
    # The list is the lower bound of every band but the last, best first. Course-first has no
    # setting: its bands are 1.0 and scoring.takes-course-score, so they always match the scorer.
    priority-tiers:
      # 3 h or more, 1 to 3 h, under 1 h of shared time per week.
      availability-hours: [3.0, 1.0]
    quality:
      strong: 0.75
      good: 0.50
    scoring:
      # What a criterion is worth when either student left it empty. 0 means missing
      # data never outranks real compatibility; the card shows it as "not shared".
      unknown-score: 0.0
      # Course score for a candidate who takes the course in focus but wants a buddy for another.
      takes-course-score: 0.5
      # Shortest shared block that counts as time to meet; shorter overlaps are ignored.
      min-session-minutes: 60
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    student-password: ${DEMO_STUDENT_PASSWORD:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}

