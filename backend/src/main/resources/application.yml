spring:
  application:
    name: study-buddy-matcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  study-room:
    default-focus-minutes: ${ROOM_DEFAULT_FOCUS_MINUTES:25}
    default-break-minutes: ${ROOM_DEFAULT_BREAK_MINUTES:5}
    max-focus-minutes: ${ROOM_MAX_FOCUS_MINUTES:180}
    max-break-minutes: ${ROOM_MAX_BREAK_MINUTES:60}
    lease-lifetime: ${ROOM_LEASE_LIFETIME:30s}
    poll-interval: ${ROOM_POLL_INTERVAL:2s}
  auth:
    secret: ${jwt.secret}
    token-lifetime: ${jwt.expiration-ms}ms
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    student-password: ${DEMO_STUDENT_PASSWORD:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
