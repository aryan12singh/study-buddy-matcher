spring:
  application:
    name: study-buddy-matcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  servlet:
    multipart:
      # Study plan uploads; both follow the assistant's own limit so they cannot drift apart.
      max-file-size: ${app.ai.assistant.study-plan.max-upload-size}
      max-request-size: ${app.ai.assistant.study-plan.max-upload-size}
  jpa:
    hibernate:
      # The SQL migrations own the schema; Hibernate only checks the mappings against it.
      # Run scripts/migrate-database.sh against every database, local ones included; do not override this.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  study-session:
    maximum-occurrences: ${SESSION_MAXIMUM_OCCURRENCES:52}
    maximum-duration-hours: ${SESSION_MAXIMUM_DURATION_HOURS:24}
  weather:
    enabled: ${WEATHER_ENABLED:true}
    latitude: ${WEATHER_LATITUDE:1.297}
    longitude: ${WEATHER_LONGITUDE:103.849}
    location: ${WEATHER_LOCATION:SMU campus}
    timeout: ${WEATHER_TIMEOUT:4s}
    cache-lifetime: ${WEATHER_CACHE_LIFETIME:15m}
    retry-interval: ${WEATHER_RETRY_INTERVAL:1m}
    maximum-stale-age: ${WEATHER_MAXIMUM_STALE_AGE:24h}
  study-room:
    default-focus-minutes: ${ROOM_DEFAULT_FOCUS_MINUTES:25}
    default-break-minutes: ${ROOM_DEFAULT_BREAK_MINUTES:5}
    max-focus-minutes: ${ROOM_MAX_FOCUS_MINUTES:180}
    max-break-minutes: ${ROOM_MAX_BREAK_MINUTES:60}
    # Longer than the one-minute timer floor browsers apply to long-hidden tabs, so a student
    # reading in another tab keeps their place. Closing the tab still leaves immediately.
    lease-lifetime: ${ROOM_LEASE_LIFETIME:90s}
    poll-interval: ${ROOM_POLL_INTERVAL:2s}
  auth:
    secret: ${jwt.secret}
    token-lifetime: ${jwt.expiration-ms}ms
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    # Wrong passwords in a row for one email before sign-in for it pauses for the lockout.
    login-throttle:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lockout: ${LOGIN_LOCKOUT:15m}
  profile:
    group-size-max: ${PROFILE_GROUP_SIZE_MAX:5}
    max-courses: ${PROFILE_MAX_COURSES:8}
  achievements:
    # Weeks start on Monday in this zone when counting the study streak.
    week-zone: Asia/Singapore
    points-per-level: 3
    connections: { bronze: 1, silver: 3, gold: 5 }
    requests-sent: { bronze: 1, silver: 5, gold: 10 }
    groups-joined: { bronze: 1, silver: 2, gold: 3 }
    groups-led: { bronze: 1, silver: 2, gold: 3 }
    sessions-planned: { bronze: 1, silver: 5, gold: 10 }
    streak-weeks: { bronze: 2, silver: 4, gold: 8 }
  matching:
    default-strategy: BALANCED
    default-enabled-criteria: [COURSE, AVAILABILITY, STUDY_MODE, STUDY_GOAL, GROUP_SIZE]
    default-min-score: 0.0
    default-result-limit: 20
    max-result-limit: 50
    # Every strategy has all five weights; omitted values are zero. Enabled weights add up to 1.
    # A priority strategy gives its own criterion the largest share, so the score and label
    # on a card always reflect what the list is ranked by.
    default-weights:
      balanced:
        course: 0.30
        availability: 0.30
        study-mode: 0.20
        study-goal: 0.10
        group-size: 0.10
      availability-first:
        course: 0.25
        availability: 0.40
        study-mode: 0.15
        study-goal: 0.10
        group-size: 0.10
      course-first:
        course: 0.40
        availability: 0.25
        study-mode: 0.15
        study-goal: 0.10
        group-size: 0.10
    # Priority strategies rank by bands of their criterion first, then by score within a band.
    # The list is the lower bound of every band but the last, best first. Course-first has no
    # setting: its bands are 1.0 and scoring.takes-course-score, so they always match the scorer.
    priority-tiers:
      # 3 h or more, 1 to 3 h, under 1 h of shared time per week.
      availability-hours: [3.0, 1.0]
    quality:
      strong: 0.75
      good: 0.50
    scoring:
      # What a criterion is worth when either student left it empty. 0 means missing
      # data never outranks real compatibility; the card shows it as "not shared".
      unknown-score: 0.0
      # Course score for a candidate who takes the course in focus but wants a buddy for another.
      takes-course-score: 0.5
      # Shortest shared block that counts as time to meet; shorter overlaps are ignored.
      min-session-minutes: 60
  ai:
    explanation:
      # Off unless application-local.yml sets enabled: true and api-key. Never put the key here.
      enabled: false
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-3.5-flash
      timeout: 5s
      max-output-tokens: 200
      max-characters: 600
      # Google's free tier allows 20 generate requests per day per project and model.
      daily-call-limit: 18
      # So one student cannot use up the shared allowance; cached explanations do not count.
      daily-call-limit-per-student: 5
      quota-zone: Asia/Singapore
      rate-limit-cooldown: 60s
    assistant:
      # Off unless application-local.yml sets enabled: true and api-key. Never put the key here.
      # Use a key from a different Google project than E1's, so the two do not share a quota.
      enabled: false
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-3.5-flash
      # Reading a PDF and writing a whole roadmap takes far longer than E1's one sentence.
      timeout: 30s
      max-output-tokens: 4000
      # Google's free tier allows 20 generate requests per day per project and model.
      daily-call-limit: 18
      daily-call-limit-per-student: 5
      quota-zone: Asia/Singapore
      rate-limit-cooldown: 60s
      study-plan:
        # Base64 makes an attached PDF a third larger, so 10MB stays inside Gemini's inline limit.
        max-upload-size: 10MB
        max-topics-characters: 4000
        # About 25,000 tokens of notes, well inside the free tier's tokens-per-minute limit.
        max-text-file-characters: 100000
        # Roadmap size limits, stated in the prompt and checked again on Gemini's reply.
        max-source-topics: 40
        max-entries-per-block: 5
        max-tasks-per-entry: 5
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    student-password: ${DEMO_STUDENT_PASSWORD:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
