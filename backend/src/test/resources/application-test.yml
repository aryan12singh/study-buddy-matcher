# Dedicated configuration for isolated PostgreSQL tests. Never loads local secrets.
spring:
  datasource:
    url: ${STUDYBUDDY_TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/studybuddy_test}
    username: ${STUDYBUDDY_TEST_DATABASE_USERNAME:studybuddy_test}
    password: ${STUDYBUDDY_TEST_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
jwt:
  secret: ${STUDYBUDDY_TEST_JWT_SECRET}
app:
  auth:
    # Suites share one context, so sign-in failures from unrelated tests must never add up to a lock.
    # LoginThrottleHttpTest sets its own low limit.
    login-throttle:
      max-failures: 1000
  weather:
    enabled: false
  demo-seed:
    enabled: false
